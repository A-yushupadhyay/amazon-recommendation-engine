<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 205" width="900" height="205" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Key measured results</title>
  <desc id="d">Four measured results: precision at 10 is 12.2 percent higher than a popularity baseline offline; p99 latency fell from 4,800 ms to 28 ms in a local Locust load test; throughput was 63.6 requests per second with no failures; and Redis and DynamoDB outages were tested by stopping them mid-run.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:14px;fill:#8b949e}
    .lab{font-size:13px;fill:#c9d1d9}
    .val{font-size:14px;font-weight:700;fill:#e6edf3}
    .note{font-size:12px;fill:#8b949e}
    .grid{stroke:#30363d;stroke-width:1}
    .big{font-size:20px;font-weight:700}
    .tl{font-size:12.5px;fill:#c9d1d9}
    .tc{font-size:11px;fill:#8b949e}
    .fade{animation:fade .7s ease-out backwards}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.gx,.gy,.fade{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="203" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans h" x="28" y="34">Measured results: offline evaluation, local load test, simulated A/B test (not production data)</text>
  <g class="fade sans" style="animation-delay:0.0s">
    <rect x="28" y="56" width="200" height="126" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="28" y="56" width="4" height="126" rx="2" fill="#58a6ff"/>
    <text class="big" x="46" y="94" fill="#58a6ff">+12.2%</text>
    <text class="tl" x="46" y="120">precision@10 vs popularity</text>
    <text class="tl" x="46" y="137">baseline</text>
    <text class="tc" x="46" y="165">offline, time-split holdout</text>
  </g>
  <g class="fade sans" style="animation-delay:0.15s">
    <rect x="242" y="56" width="200" height="126" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="242" y="56" width="4" height="126" rx="2" fill="#3fb950"/>
    <text class="big" x="260" y="94" fill="#3fb950">4,800 to 28 ms</text>
    <text class="tl" x="260" y="120">p99 latency after</text>
    <text class="tl" x="260" y="137">concurrency fix</text>
    <text class="tc" x="260" y="165">Locust, 20 concurrent users</text>
  </g>
  <g class="fade sans" style="animation-delay:0.3s">
    <rect x="456" y="56" width="200" height="126" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="456" y="56" width="4" height="126" rx="2" fill="#3fb950"/>
    <text class="big" x="474" y="94" fill="#3fb950">63.6 req/s</text>
    <text class="tl" x="474" y="120">throughput, 0%</text>
    <text class="tl" x="474" y="137">failed requests</text>
    <text class="tc" x="474" y="165">same test, DynamoDB Local</text>
  </g>
  <g class="fade sans" style="animation-delay:0.44999999999999996s">
    <rect x="670" y="56" width="200" height="126" rx="10" fill="#161b22" stroke="#30363d"/>
    <rect x="670" y="56" width="4" height="126" rx="2" fill="#d29922"/>
    <text class="big" x="688" y="94" fill="#d29922">2 outages</text>
    <text class="tl" x="688" y="120">Redis and DynamoDB</text>
    <text class="tl" x="688" y="137">stopped mid-run</text>
    <text class="tc" x="688" y="165">fallback results served</text>
  </g>
</svg>
