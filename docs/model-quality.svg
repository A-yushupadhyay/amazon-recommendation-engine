<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Offline model quality: collaborative filtering vs popularity baseline</title>
  <desc id="d">Bar charts with axes starting at zero. Precision at 10: 0.0295 for collaborative filtering versus 0.0263 for the popularity baseline. Recall at 10: 0.0605 versus 0.0539. Both are a 12.2 percent relative improvement.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:14px;fill:#8b949e}
    .lab{font-size:13px;fill:#c9d1d9}
    .val{font-size:14px;font-weight:700;fill:#e6edf3}
    .note{font-size:12px;fill:#8b949e}
    .grid{stroke:#30363d;stroke-width:1}
    .gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .9s ease-out backwards}
    @keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @media (prefers-reduced-motion: reduce){.gx,.gy,.fade{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="348" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans h" x="28" y="34">Offline evaluation on a time-based holdout (trained on past interactions, tested on future ones)</text>
  <text class="sans lab" x="28" y="70" font-weight="600">Precision@10</text>
  <line class="grid" x1="28" y1="262" x2="428" y2="262"/>
  <rect class="gy" x="78" y="135.6" width="110" height="126.4" rx="4" fill="#58a6ff" style="animation-delay:0.0s"/>
  <text class="sans val" x="133" y="127.6" text-anchor="middle">0.0295</text>
  <text class="sans note" x="133" y="280" text-anchor="middle">Collaborative filtering</text>
  <rect class="gy" x="258" y="149.3" width="110" height="112.7" rx="4" fill="#6e7681" style="animation-delay:0.15s"/>
  <text class="sans val" x="313" y="141.3" text-anchor="middle">0.0263</text>
  <text class="sans note" x="313" y="280" text-anchor="middle">Popularity baseline</text>
  <text class="sans" x="228" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">+12.2% relative · +0.0032 absolute</text>
  <text class="sans lab" x="470" y="70" font-weight="600">Recall@10</text>
  <line class="grid" x1="470" y1="262" x2="870" y2="262"/>
  <rect class="gy" x="520" y="132.4" width="110" height="129.6" rx="4" fill="#58a6ff" style="animation-delay:0.0s"/>
  <text class="sans val" x="575" y="124.4" text-anchor="middle">0.0605</text>
  <text class="sans note" x="575" y="280" text-anchor="middle">Collaborative filtering</text>
  <rect class="gy" x="700" y="146.5" width="110" height="115.5" rx="4" fill="#6e7681" style="animation-delay:0.15s"/>
  <text class="sans val" x="755" y="138.5" text-anchor="middle">0.0539</text>
  <text class="sans note" x="755" y="280" text-anchor="middle">Popularity baseline</text>
  <text class="sans" x="670" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">+12.2% relative · +0.0066 absolute</text>
  <text class="sans note" x="28" y="336">Axes start at zero. Baseline = trending items. Dataset: Amazon Reviews 2023, Software category.</text>
</svg>
