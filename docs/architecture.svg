<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">System architecture: offline training and online serving</title>
  <desc id="d">Offline: reviews are cleaned and split by time, an item-item collaborative filtering model is trained, and the top 20 similar items per item are loaded into DynamoDB. Online: a request checks the Redis cache first, then DynamoDB, and falls back to trending items on a cold start or when DynamoDB is down.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .node{fill:#161b22;stroke:#30363d;stroke-width:1.5}
    .name{font-size:15px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .cap{font-size:11px;fill:#8b949e;text-anchor:middle}
    .step{font-size:11px;fill:#58a6ff;text-anchor:middle}
    .flow{stroke:#484f58;stroke-width:2;fill:none}
    .dash{stroke-dasharray:5 5;animation:dash 1.2s linear infinite}
    .lane{font-size:12px;fill:#6e7681;letter-spacing:.08em}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion: reduce){.dash{animation:none}}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e7681"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="408" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans lane" x="28" y="34">OFFLINE · BATCH TRAINING</text>
  <text class="sans lane" x="28" y="212">ONLINE · PER REQUEST</text>
  <g class="sans">
    <path class="flow dash" d="M168 84.0H200" marker-end="url(#ah)"/>
    <path class="flow dash" d="M344 84.0H376" marker-end="url(#ah)"/>
    <path class="flow dash" d="M520 84.0H552" marker-end="url(#ah)"/>
    <path class="flow dash" d="M696 84.0H728" marker-end="url(#ah)"/>
    <path class="flow dash" d="M802 116V168H450V246" marker-end="url(#ah)"/>
    <path class="flow dash" d="M168 282.0H200" marker-end="url(#ah)"/>
    <path class="flow dash" d="M344 282.0H376" marker-end="url(#ah)"/>
    <path class="flow dash" d="M520 282.0H552" marker-end="url(#ah)"/>
    <path class="flow dash" d="M696 282.0H728" marker-end="url(#ah)"/>
    <path class="flow dash" d="M274 250V232H802V246" marker-end="url(#ah)"/>
    <path class="flow dash" d="M450 314V352H802V318" marker-end="url(#ah)"/>
  </g>
  <text class="sans" x="640" y="160" font-size="11" fill="#6e7681" text-anchor="middle">batch load</text>
  <circle r="5" fill="#3fb950">
    <animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M98 282.0H274V232H802V282.0" keyPoints="0;1;1" keyTimes="0;0.3;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.3;0.32;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#58a6ff">
    <animateMotion dur="9s" begin="3s" repeatCount="indefinite" path="M98 282.0H450V352H802V282.0" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.4;0.42000000000000004;1" dur="9s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#d29922">
    <animateMotion dur="9s" begin="6s" repeatCount="indefinite" path="M98 282.0H802" keyPoints="0;1;1" keyTimes="0;0.4;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.4;0.42000000000000004;1" dur="9s" begin="6s" repeatCount="indefinite"/>
  </circle>
  <g class="sans">
    <rect class="node" x="28" y="52" width="140" height="64" rx="10"/><text class="name" x="98.0" y="82.0">Reviews</text><text class="cap" x="98.0" y="104">Amazon Reviews 2023</text>
    <rect class="node" x="204" y="52" width="140" height="64" rx="10"/><text class="name" x="274.0" y="82.0">Clean + split</text><text class="cap" x="274.0" y="104">time-based train/test</text>
    <rect class="node" x="380" y="52" width="140" height="64" rx="10"/><text class="name" x="450.0" y="82.0">Train CF</text><text class="cap" x="450.0" y="104">item-item cosine</text>
    <rect class="node" x="556" y="52" width="140" height="64" rx="10"/><text class="name" x="626.0" y="82.0">Top-20 table</text><text class="cap" x="626.0" y="104">similar items per item</text>
    <rect class="node" x="732" y="52" width="140" height="64" rx="10" style="stroke:#58a6ff"/><text class="name" x="802.0" y="82.0">DynamoDB</text><text class="cap" x="802.0" y="104">single-key lookup</text>
    <rect class="node" x="28" y="250" width="140" height="64" rx="10"/><text class="name" x="98.0" y="280.0">Request</text><text class="cap" x="98.0" y="302">item_id</text>
    <rect class="node" x="204" y="250" width="140" height="64" rx="10"/><text class="name" x="274.0" y="280.0">Redis cache</text><text class="cap" x="274.0" y="302">hot items, fast reads</text>
    <rect class="node" x="380" y="250" width="140" height="64" rx="10" style="stroke:#58a6ff"/><text class="name" x="450.0" y="280.0">DynamoDB</text><text class="cap" x="450.0" y="302">item to similar items</text>
    <rect class="node" x="556" y="250" width="140" height="64" rx="10" style="stroke:#d29922"/><text class="name" x="626.0" y="280.0">Fallback</text><text class="cap" x="626.0" y="302">trending items</text>
    <rect class="node" x="732" y="250" width="140" height="64" rx="10" style="stroke:#3fb950"/><text class="name" x="802.0" y="280.0">Response</text><text class="cap" x="802.0" y="302">recommendations</text>
  </g>
  <g class="sans" font-size="12" fill="#8b949e">
    <circle cx="36" cy="384" r="5" fill="#3fb950"/><text x="48" y="388">cache hit</text>
    <circle cx="140" cy="384" r="5" fill="#58a6ff"/><text x="152" y="388">found in DynamoDB, then cached</text>
    <circle cx="378" cy="384" r="5" fill="#d29922"/><text x="390" y="388">cold start, or DynamoDB down (circuit breaker)</text>
  </g>
</svg>
