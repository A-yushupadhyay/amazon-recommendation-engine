<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Tail latency before and after the concurrency fix</title>
  <desc id="d">Horizontal bars on a logarithmic axis. Median latency was 10 milliseconds. The first load test showed a p99 of 4,800 milliseconds; after fixing the concurrency configuration p99 was 28 milliseconds, about 170 times lower.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:14px;fill:#8b949e}
    .lab{font-size:13px;fill:#c9d1d9}
    .val{font-size:14px;font-weight:700;fill:#e6edf3}
    .note{font-size:12px;fill:#8b949e}
    .grid{stroke:#30363d;stroke-width:1}
    .gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx .9s ease-out backwards}
    @keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.gx,.gy,.fade{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="308" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans h" x="28" y="34">Same load test (Locust, 20 concurrent users), logarithmic scale</text>
  <line class="grid" x1="230" y1="60" x2="230" y2="232"/>
  <text class="sans note" x="230" y="252" text-anchor="middle">1 ms</text>
  <line class="grid" x1="380" y1="60" x2="380" y2="232"/>
  <text class="sans note" x="380" y="252" text-anchor="middle">10 ms</text>
  <line class="grid" x1="530" y1="60" x2="530" y2="232"/>
  <text class="sans note" x="530" y="252" text-anchor="middle">100 ms</text>
  <line class="grid" x1="680" y1="60" x2="680" y2="232"/>
  <text class="sans note" x="680" y="252" text-anchor="middle">1 s</text>
  <line class="grid" x1="830" y1="60" x2="830" y2="232"/>
  <text class="sans note" x="830" y="252" text-anchor="middle">10 s</text>
  <text class="sans lab" x="216" y="98" text-anchor="end">p50 (median)</text>
  <rect class="gx" x="230" y="76" width="150.0" height="32" rx="4" fill="#6e7681" style="animation-delay:0.0s"/>
  <text class="sans val" x="390.0" y="98">10 ms</text>
  <text class="sans lab" x="216" y="150" text-anchor="end">p99 before fix</text>
  <rect class="gx" x="230" y="128" width="552.2" height="32" rx="4" fill="#f85149" style="animation-delay:0.2s"/>
  <text class="sans val" x="792.2" y="150">4,800 ms</text>
  <text class="sans lab" x="216" y="202" text-anchor="end">p99 after fix</text>
  <rect class="gx" x="230" y="180" width="217.1" height="32" rx="4" fill="#3fb950" style="animation-delay:0.4s"/>
  <text class="sans val" x="457.1" y="202">28 ms</text>
  <text class="sans" x="872" y="292" text-anchor="end" font-size="13" font-weight="600" fill="#3fb950">about 170x lower p99 (4,800 / 28 = 171)</text>
  <text class="sans note" x="28" y="292">Cause reported: thread-pool queuing under concurrent load.</text>
</svg>
