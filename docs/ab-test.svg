<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Simulated A/B test: click-through rate and required sample size</title>
  <desc id="d">Left: simulated click-through rate was 18.33 percent for collaborative filtering with 1,462 users and 18.07 percent for the popularity baseline with 1,444 users. Right: about 1,450 users per variant were simulated, but roughly 356,000 per variant would be needed to detect a lift this small. The two-proportion test gave p equals 0.858, not statistically significant.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:14px;fill:#8b949e}
    .lab{font-size:13px;fill:#c9d1d9}
    .val{font-size:14px;font-weight:700;fill:#e6edf3}
    .note{font-size:12px;fill:#8b949e}
    .grid{stroke:#30363d;stroke-width:1}
    .gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx .9s ease-out backwards}
    @keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion: reduce){.gx,.gy,.fade{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="328" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text class="sans h" x="28" y="34">Simulation with consistent-hash variant assignment (not real user traffic)</text>
  <text class="sans lab" x="28" y="72" font-weight="600">Click-through rate</text>
  <text class="sans note" x="28" y="92">A  Collaborative filtering · n = 1,462</text>
  <rect class="gx" x="28" y="100" width="293.3" height="28" rx="4" fill="#58a6ff"/>
  <text class="sans val" x="331.3" y="120">18.33%</text>
  <text class="sans note" x="28" y="154">B  Popularity baseline · n = 1,444</text>
  <rect class="gx" x="28" y="162" width="289.1" height="28" rx="4" fill="#6e7681"/>
  <text class="sans val" x="327.1" y="182">18.07%</text>
  <text class="sans lab" x="480" y="72" font-weight="600">Users per variant</text>
  <text class="sans note" x="480" y="92">Simulated</text>
  <rect class="gx" x="480" y="100" width="3" height="28" rx="1.5" fill="#6e7681"/>
  <text class="sans val" x="494" y="120">~1,450</text>
  <text class="sans note" x="480" y="154">Needed to detect this lift reliably (power analysis)</text>
  <rect class="gx" x="480" y="162" width="390" height="28" rx="4" fill="#d29922" style="animation-delay:.2s"/>
  <text class="sans val" x="494" y="182" fill="#0d1117" style="fill:#0d1117">~356,000</text>
  <rect x="28" y="228" width="844" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
  <text class="sans" x="450" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Relative lift +1.4%, p = 0.858: not statistically significant</text>
  <text class="sans note" x="450" y="270" text-anchor="middle">The offline ranking gain was clear; the online lift is inconclusive at this sample size (about 245x too small).</text>
  <text class="sans note" x="28" y="312">Two-proportion z-test. A simulated result does not establish a real-world business lift.</text>
</svg>
